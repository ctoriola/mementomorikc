<!doctype html>
<html class="no-js" lang="zxx">

<head>

   <meta charset="utf-8">
   <meta http-equiv="x-ua-compatible" content="ie=edge">
   <title>Kingsley Chinda - Booking</title>
   <meta name="description" content="Book Kingsley Chinda for your next photography session.">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Place favicon.ico in the root directory -->
   <link rel="shortcut icon" type="image/x-icon" href="assets/img/logo/favicon.png">

   <!-- CSS here -->
   <link rel="stylesheet" href="assets/css/bootstrap.min.css">
   <link rel="stylesheet" href="assets/css/swiper-bundle.css">
   <link rel="stylesheet" href="assets/css/nice-select.css">
   <link rel="stylesheet" href="assets/css/magnific-popup.css">
   <link rel="stylesheet" href="assets/css/font-awesome-pro.css">
   <link rel="stylesheet" href="assets/css/spacing.css">
   <link rel="stylesheet" href="assets/css/main.css">

   <style>
      .booking-bg {
         position: fixed;
         inset: 0;
         z-index: 0;
         background-image: url('assets/img/portfolio/skew/skew-1.jpg');
         background-size: cover;
         background-position: center;
         filter: blur(6px) brightness(0.55);
         transform: scale(1.03);
         pointer-events: none;
      }
      .content-wrap { position: relative; z-index: 1; }

      /* White card background for the booking form */
      .contact-form {
         background: rgba(255,255,255,0.98);
         padding: 36px;
         border-radius: 14px;
         box-shadow: 0 18px 50px rgba(12,22,39,0.18);
         -webkit-backdrop-filter: blur(2px);
         backdrop-filter: blur(2px);
      }

      /* Title and text colors inside the card */
      .contact-form .section-title { margin-bottom: 18px; }
      .contact-form .title { color: #0c1727; }
      .contact-form p { color: #556; }

      /* Normalize form control sizing for consistent heights */
      .contact-form .form-control {
         box-sizing: border-box;
         display: block;
         width: 100%;
         height: 52px;
         padding: 12px 16px;
         border-radius: 8px;
         border: 1px solid rgba(12,22,39,0.08);
         background: #ffffff;
         font-size: 15px;
         line-height: 1.2;
      }

      .contact-form textarea.form-control {
         height: auto;
         min-height: 130px;
         padding: 12px 16px;
         resize: vertical;
      }

      .contact-form .form-group { margin-bottom: 16px; }

      /* Slightly reduce intensity on small screens for performance */
      @media (max-width: 600px) {
         .contact-form { padding: 20px; border-radius: 10px; }
         .booking-bg { filter: blur(4px) brightness(0.6); }
      }
   </style>

</head>

<body class="tp-magic-cursor">

         <span></span>
         <span></span>
      </div>

   <!-- preloader end  -->

   <!-- Begin magic cursor -->
   <div id="magic-cursor" class="cursor-black-bg">
      <div id="ball"></div>
   </div>
   <!-- End magic cursor -->

   <div class="booking-bg" aria-hidden="true"></div>

   <!-- offcanvas 2 start -->
   <div class="tp-offcanvas-2-area p-relative">
      <div class="offcanvas-bg"></div>
      <div class="tp-offcanvas-2-wrapper offcanvas-menu">
         <div class="tp-offcanvas-2-left">
            <div class="tp-header-logo d-flex justify-content-between align-items-center mb-50">
               <a href="index.html">
                  <img data-width="170" src="assets/img/logo/logo.png" alt="">
               </a>
               <span class="hamburger-close-btn">
                  <svg width="37" height="38" viewBox="0 0 37 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                     <path d="M9.19141 9.80762L27.5762 28.1924" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                     <path d="M9.19141 28.1924L27.5762 9.80761" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
               </span>
            </div>
            <div class="tp-offcanvas-menu counter-row">
               <nav></nav>
            </div>
            <span class="hamburger-close-btn hamburger-mobile-close-btn d-md-none">CLOSE</span>
         </div>
      </div>
   </div>
   <!-- offcanvas 2 end -->


   <header>

      <!-- header area start -->
      <div class="tp-header-area tp-header-spacing header-transparent">
         <div class="container">
            <div class="row align-items-center">
               <div class="col-6">
                  <div class="tp-header-logo">
                     <a href="index.html">
                        <h3 class="text-white">KC</h3>
                     </a>
                  </div>
               </div>
               <div class="col-xl-6 d-none">
                  <div class="tp-main-menu d-flex justify-content-center">
                     <nav class="tp-mobile-menu-active">
                        <ul>
                           <li class="">
                              <a href="index.html">Home</a>
                           </li>
                           <li class="">
                              <a href="about-me.html">Who is KC</a>
                           </li>
                           <li class="">
                              <a href="booking.html">Let's Shoot</a>
                           </li>
                           <li class="">
                              <a href="contact-me.html">Get in Touch</a>
                           </li>
                        </ul>
                     </nav>
                  </div>
               </div>
               <div class="col-6">
                  <div class="tp-header-right d-flex justify-content-end">
                     <button class="hamburger-open-btn tp-header-sidebar-btn tp-header-sidebar-btn-bg tp-header-sidebar-btn-bg-white">
                        <span></span>
                        <span></span>
                     </button>
                  </div>
               </div>
            </div>
         </div>
      </div>
      <!-- header area end -->

   </header>

   <main class="content-wrap">

      <section class="pt-120 pb-120">
         <div class="container">
            <div class="row justify-content-center">
               <div class="col-lg-8">
                  <div class="contact-form">
                     <div class="section-title text-center mb-30">
                        <h2 class="title">Book a Session</h2>
                        <p>Please complete the form below and we'll get back to you.</p>
                     </div>

                     <form id="contact-form" action="/api/booking" method="post">
                        <div class="row">
                           <div class="col-md-6">
                              <div class="form-group">
                                 <input id="name" name="name" class="form-control" placeholder="Full name" required>
                              </div>
                           </div>
                           <div class="col-md-6">
                              <div class="form-group">
                                 <input id="email" name="email" type="email" class="form-control" placeholder="Email" required>
                              </div>
                           </div>
                           <div class="col-md-6">
                              <div class="form-group">
                                 <input id="phone" name="phone" class="form-control" placeholder="Phone" required>
                              </div>
                           </div>
                           <div class="col-md-3">
                              <div class="form-group">
                                 <input id="date" name="date" type="date" class="form-control" placeholder="Date">
                              </div>
                           </div>
                           <div class="col-md-3">
                              <div class="form-group">
                                 <input id="time" name="time" type="time" class="form-control" placeholder="Time">
                              </div>
                           </div>
                           <div class="col-12">
                              <div class="form-group">
                                 <textarea id="message" name="message" class="form-control" rows="4" placeholder="Message"></textarea>
                              </div>
                           </div>
                           <div class="col-12">
                              <div class="ajax-response mb-4"></div>
                              <button type="submit" class="btn btn-primary">Send Booking</button>
                           </div>
                        </div>
                     </form>
                  </div>

               </div>
            </div>
         </div>
      </section>

   </main>


   <!-- JS here -->
